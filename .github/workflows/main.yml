name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Clean stale build environment
        run: rm -rf .venv build

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Accept Android SDK licenses
        run: |
          yes | find / -name "sdkmanager" 2>/dev/null | head -n 1 | xargs -r -I{} sh -c 'yes | "{}" --licenses' || true

      - name: Build Android APK
        id: build
        uses: flet-dev/flet-build-action@v1
        with:
          target: apk
          runner-python-version: "3.12"
          bundled-python-version: "3.12"
          build-number: ${{ github.run_number }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: aperion-music-apk
          path: ${{ steps.build.outputs.archive-path }}
          archive: false
