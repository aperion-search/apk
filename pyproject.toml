[project]
name = " Aperion-Music"
version = "1.0.0"
description = "Sacred Instrumentals Audio Player"
requires-python = ">=3.10"
dependencies = [
    "flet",
    "flet-cli",
    "flet-audio",
]

[tool.flet]
org = "com.aperion-search.music"
product = "Sacred Instrumentals"

[tool.flet.android.permission]
"android.permission.INTERNET" = true
"android.permission.READ_EXTERNAL_STORAGE" = true
"android.permission.WRITE_EXTERNAL_STORAGE" = true
